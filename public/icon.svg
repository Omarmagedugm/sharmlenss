<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Camera / Lens Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="16" opacity="0.8" />
  <circle cx="256" cy="256" r="148" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Aperture Blades -->
  <g stroke="#38bdf8" stroke-width="3" fill="#1e293b" opacity="0.95">
    <path d="M 256 128 L 330 200 L 290 256 Z" fill="#0369a1"/>
    <path d="M 364 200 L 364 300 L 300 280 Z" fill="#0284c7"/>
    <path d="M 350 320 L 276 380 L 256 310 Z" fill="#0ea5e9"/>
    <path d="M 230 380 L 160 320 L 210 270 Z" fill="#0284c7"/>
    <path d="M 150 290 L 160 190 L 220 220 Z" fill="#0369a1"/>
    <path d="M 180 170 L 260 130 L 256 210 Z" fill="#0ea5e9"/>
  </g>

  <!-- Sea waves & boat silhouette inside lens -->
  <path d="M 180 300 Q 220 285, 256 300 T 332 300" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <path d="M 195 320 Q 230 308, 256 320 T 317 320" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Sailboat icon in center -->
  <path d="M 236 210 L 256 170 L 256 240 Z" fill="url(#goldGrad)" />
  <path d="M 262 190 L 278 240 L 262 240 Z" fill="#fef08a" />
  <path d="M 228 245 L 284 245 L 274 256 L 238 256 Z" fill="#ffffff" />

  <!-- Lens reflection highlight -->
  <path d="M 180 180 A 110 110 0 0 1 300 150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4" />
</svg>
